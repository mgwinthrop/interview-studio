# Create a NEW Fly app, then deploy with --app YOUR_PERSONAL_APP.
# No company app is configured here.
primary_region = 'iad'

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  max_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

[mounts]
  source = "interview_data"
  destination = "/data"

[env]
  NODE_ENV = "production"
  PORT = "3001"
