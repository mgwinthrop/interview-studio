name: Bug report
description: Something is broken
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: { label: What happened, description: "What did you expect instead?" }
    validations: { required: true }
  - type: textarea
    id: repro
    attributes: { label: Steps to reproduce }
    validations: { required: true }
  - type: dropdown
    id: profile
    attributes:
      label: Profile
      options: [mock, cloud]
  - type: input
    id: env
    attributes: { label: "Node version, OS and browser" }
  - type: markdown
    attributes:
      value: "Do not paste API keys, transcripts or database contents."
