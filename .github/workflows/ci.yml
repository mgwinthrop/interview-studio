name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/backend/package-lock.json
            apps/frontend/package-lock.json
      - run: npm --prefix apps/backend ci
      - run: npm --prefix apps/frontend ci
      - run: npx prisma generate
        working-directory: apps/backend
      - name: Unit tests, backend then frontend (mock providers, no keys)
        run: npm test
      - name: Backend build
        run: npm --prefix apps/backend run build
      - name: Frontend lint
        run: npm --prefix apps/frontend run lint
      - name: Frontend build
        run: npm --prefix apps/frontend run build
      - name: No test seams in the production build
        # Fails if NEXT_PUBLIC_TEST_SEAMS code reached .next (FQ-108 S0). The e2e build uses .next-e2e.
        run: npm --prefix apps/frontend run check:no-test-seams
      - name: Install the Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: apps/frontend
      - name: Frontend browser tests (mock backend, no keys)
        run: npm run test:e2e
        working-directory: apps/frontend
      - name: Keep the browser test report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/frontend/playwright-report
            apps/frontend/test-results
          retention-days: 7
      - name: Audit production dependencies (advisory)
        # Known major-version fixes (next, zod) are tracked separately, so this reports without blocking.
        continue-on-error: true
        run: |
          npm --prefix apps/backend audit --omit=dev --audit-level=high
          npm --prefix apps/frontend audit --omit=dev --audit-level=high
